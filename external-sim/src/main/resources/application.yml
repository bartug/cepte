server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: cepte-external-sim
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bartugsevindik.cepte: ${LOG_LEVEL:INFO}

application:
  sim:
    backend-url: ${BACKEND_URL:http://localhost:8100}
    internal-token: ${INTERNAL_API_TOKEN:local-dev-only-internal-token}
    zone: Europe/Istanbul
