services:
  # PostgreSQL. Her modülün kendi şeması var (appconfig, identity, wallet, ...)
  # payment-switch ile aynı anda çalışabilsin diye host portu 5433
  postgres:
    image: postgres:16-alpine
    container_name: cepte-postgres
    environment:
      POSTGRES_DB: ${PG_DB:-cepte}
      POSTGRES_USER: ${PG_USERNAME:-cepte}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cepte}
      TZ: ${TZ:-Europe/Istanbul}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USERNAME:-cepte}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  # Redis (OTP deneme sayaçları, rate limit; CP-2'de kullanılmaya başlanacak)
  redis:
    image: redis:7-alpine
    container_name: cepte-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  backend:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cepte-backend
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      SIMULATOR_URL: http://external-sim:8091
      # Apple M4'te JDK 21 SVE nedeniyle SIGILL veriyor
      JAVA_TOOL_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  external-sim:
    profiles: [ "app" ]
    build:
      context: .
      dockerfile: external-sim/Dockerfile
    container_name: cepte-external-sim
    environment:
      BACKEND_URL: http://backend:8080
      JAVA_TOOL_OPTIONS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "8091:8091"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
